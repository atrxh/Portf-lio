<html lang="pt-BR"><head><meta charset="utf-8"><title>Arthur Gomes da Silva | Portfólio</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><script>
(function(l){var segmentCount=1;var base=l.pathname.split('/').slice(0,1+segmentCount).join('/');var route=l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g,'~and~');var query=l.search?('&'+l.search.slice(1).replace(/&/g,'~and~')):'';l.replace(l.protocol+'//'+l.hostname+(l.port?':'+l.port:'')+base+'/?/'+route+query+l.hash);})(window.location);
